[package]
name = "nano-rs"
version = "2.2.1"
edition = "2021"
authors = ["Gleicon Moraes <gleicon@gmail.com>"]
description = "Multi-tenant JavaScript edge runtime (Rust + rusty_v8)"
license = "MIT"

[lib]
name = "nano"
path = "src/lib.rs"

[[bin]]
name = "nano-rs"
path = "src/main.rs"

[[bin]]
name = "cve-scanner"
path = "tools/cve_scanner.rs"

[dependencies]
# Core V8 bindings (v147)
v8 = "150"

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "compression-gzip", "compression-deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL parsing and encoding
url = "2.5"
percent-encoding = "2.3"
bytes = "1.6"
base64 = "0.22"

# Cryptographic randomness
getrandom = "0.2"

# WebCrypto implementation via ring crate
ring = "0.17"
zeroize = { version = "1.8", features = ["derive"] }

# Checksum for file watching
sha2 = "0.10"

# Concurrent hash map for VFS backend
dashmap = "6.1"

# Static initialization
lazy_static = "1.4"

# Async blocking for timer callbacks
pollster = "0.4"

# Signal handling for timeout timer (async-safe)
signal-hook = "0.3"

# HTTP client for outbound fetch()
hyper = { version = "1.4", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# WebSocket support
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"

# Compression streams (CompressionStream/DecompressionStream)
flate2 = "1.0"

# RSA and ECDSA cryptography (WebCrypto RSA-OAEP, RSASSA-PKCS1-v1_5, ECDSA)
rsa = { version = "0.9", features = ["pem", "sha2"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
elliptic-curve = { version = "0.13", features = ["ecdh", "pkcs8"] }
signature = "2.2"

# Workaround for Rust version compatibility
home = "=0.5.11"

# Async trait for VFS backends
async-trait = "0.1"

# Random for temp file suffixes in DiskBackend
rand = "0.8"

# Embedded KV storage for nano:kv module
edgestore = "1.6.0"

# S3-compatible object storage
rust-s3 = { version = "0.37", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }

# Tar archive format for sliver snapshots
tar = "0.4"

# Secure temporary files
tempfile = "3.10"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Directory walking for VFS file loading
walkdir = "2.5"

# FFI support for V8 external data pointers and POSIX timers
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
libc = "0.2"

[features]
default = []
vfs-s3 = ["rust-s3", "tokio-util"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
rsa = "0.9.10"
p256 = "0.13.2"
p384 = "0.13.1"
elliptic-curve = "0.13.8"
futures = "0.3"

[[bench]]
name = "sliver_cold_start"
harness = false
