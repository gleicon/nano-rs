# Cargo Deny Configuration
# 
# This configuration enforces security policies for dependencies.
# Run with: cargo deny check

[graph]
# Include dev dependencies in checks
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "warn"

# Transitive deps with no available patch — ignore rather than block CI
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste crate unmaintained; transitive dep, not directly called" },
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack; transitive dep, no direct PKCS1v1.5 decrypt in nano-rs" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml; transitive dep, not directly used" },
]

[licenses]
# Whitelist of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
]

# Confidence threshold for license detection
confidence-threshold = 0.8

[licenses.private]
# Ignore private workspace crates
ignore = false
registries = []

[bans]
# Banned crate versions (security or policy reasons)
# Multiple versions of the same crate
multiple-versions = "warn"

# Wildcard dependencies not allowed
wildcards = "warn"

# Highlight specific crate duplication
# highlight = "all"

# Skip certain duplicate versions (temporary exceptions)
skip = [
    # { name = "crate-name", version = "=0.1.0" },
]

skip-tree = [
    # { name = "crate-name", version = "=0.1.0", depth = 2 },
]

[sources]
# Allowed crate registries
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]

# Allow crates from specific git repositories
# allowed-git = [
#     "https://github.com/owner/repo",
# ]

[sources.allow-org]
# Allow crates from specific GitHub organizations
# github = ["your-org"]
# gitlab = ["your-org"]
# bitbucket = ["your-org"]
