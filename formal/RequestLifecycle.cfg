\* The HTTP handler contract: exactly-one terminal response, bounded queue,
\* and no request hangs. Expected: all invariants + the liveness property hold.

CONSTANTS
    NumRequests = 4
    QueueCap = 2

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT DoneIffResponded
INVARIANT QueueBounded
INVARIANT AtMostOneRunning

PROPERTY EveryRequestResponds
