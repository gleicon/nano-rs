\* CpuLimit=TRUE models the --config serving path (a per-app CPU limit is armed):
\* the worker is always freed and every request responds. Expected: all hold.
\* See RequestLifecycle_NoCpuLimit.cfg for the shared-router path (CpuLimit=FALSE),
\* where a runaway handler wedges the worker and a queued request never responds.

CONSTANTS
    NumRequests = 3
    QueueCap = 2
    CpuLimit = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT RespondedIffOutcome
INVARIANT QueueBounded
INVARIANT WorkerOccupancy

PROPERTY EveryClientResponds
