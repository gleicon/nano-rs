\* TLC configuration for the SHIPPED design (refcount-based drain).
\* Expected result: all invariants + the liveness property hold.
\*
\* To reproduce the counterexample for the buggy hard-kill variant, set
\* HardKill <- TRUE below and re-run: TLC reports NoDispatchToDead violated.

CONSTANTS
    MaxGen = 3
    MaxInflight = 3
    HardKill = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SlotIsLive
INVARIANT NoDispatchToDead

PROPERTY EventuallyReaped
