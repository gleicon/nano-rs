\* CpuLimit=FALSE models an app with no worker-side CPU limit armed — now reachable
\* only by explicitly setting cpu_time_enabled:false (the shared-router path used to
\* hit this by default before get_cpu_time_limit_ms fell back to 50ms). Expected:
\* EveryClientResponds is VIOLATED — a runaway handler that only hits the client-side
\* timeout keeps the worker occupied, and a request queued behind it never runs.

CONSTANTS
    NumRequests = 3
    QueueCap = 2
    CpuLimit = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT RespondedIffOutcome
INVARIANT QueueBounded
INVARIANT WorkerOccupancy

PROPERTY EveryClientResponds
