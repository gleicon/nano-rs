\* CpuLimit=FALSE models the shared-router / admin-driven serving path, where
\* AppState is built with app_registry=None so get_cpu_time_limit_ms returns 0 and
\* no worker-side CPU termination is armed. Expected: EveryClientResponds is
\* VIOLATED — a runaway handler that only hits the client-side timeout keeps the
\* worker occupied, and a request queued behind it never runs.

CONSTANTS
    NumRequests = 3
    QueueCap = 2
    CpuLimit = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT RespondedIffOutcome
INVARIANT QueueBounded
INVARIANT WorkerOccupancy

PROPERTY EveryClientResponds
