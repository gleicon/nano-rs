name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-build-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin nano-rs --bin cve-scanner
        timeout-minutes: 30

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="nano-rs-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE}" \
            -C target/${{ matrix.target }}/release \
            nano-rs cve-scanner
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${TAG#v}"
          # Prefer the matching CHANGELOG.md section (literal match — the version
          # string contains regex metachars), fall back to the commit log.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md | sed '/./,$!d' > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
            if [ -n "$PREV" ]; then
              git log "${PREV}..${TAG}" --pretty=format:'- %s (%h)' --no-merges > dist/notes.md
            else
              git log --pretty=format:'- %s (%h)' --no-merges | head -20 > dist/notes.md
            fi
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # gh release create hard-fails if the release already exists (e.g. a
          # manually-created release pushed the tag that triggered this run), so
          # fall back to uploading the assets onto the existing release.
          gh release create "${TAG}" dist/*.tar.gz \
            --title "${TAG}" \
            --notes-file dist/notes.md \
            --verify-tag \
          || gh release upload "${TAG}" dist/*.tar.gz --clobber
